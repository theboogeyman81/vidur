[project]
name = "vidur"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero]>=0.12",
    "livekit-plugins-google>=0.12",
    "google-generativeai>=0.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "pydantic-ai[google]>=0.0.14",
    "aiosqlite>=0.20",
    "qdrant-client[fastembed]>=1.9",
    "voyageai>=0.3",
    "pypdf>=4.0",
    "tiktoken>=0.7",
    "langfuse>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
